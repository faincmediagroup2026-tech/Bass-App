<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bass App</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #14141f;
      --accent: #7c3aed;
      --accent-glow: #a78bfa;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e1e2e;
      --success: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(124, 58, 237, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(167, 139, 250, 0.1) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    header {
      padding: 28px 28px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #c4b5fd, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .upload-zone {
      margin: 24px;
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      background: rgba(124, 58, 237, 0.05);
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(124, 58, 237, 0.12);
    }

    .upload-zone input {
      display: none;
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .upload-zone h3 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .upload-zone span {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .player {
      padding: 0 24px 24px;
      display: none;
    }

    .player.active {
      display: block;
    }

    .track-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .track-name {
      font-weight: 600;
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .track-meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .visualizer {
      width: 100%;
      height: 80px;
      border-radius: 12px;
      background: #0d0d14;
      margin-bottom: 20px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .progress-container {
      margin-bottom: 16px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress-bar {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1e1e2e;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      color: var(--accent-glow);
      transform: scale(1.08);
    }

    .btn-play {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #5b21b6);
      color: white;
      font-size: 1.4rem;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
    }

    .btn-play:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.55);
    }

    .btn-secondary {
      font-size: 1.3rem;
      width: 40px;
      height: 40px;
    }

    .slider-group {
      margin-bottom: 20px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .slider-label {
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-value {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-glow);
      background: rgba(124, 58, 237, 0.15);
      padding: 2px 10px;
      border-radius: 20px;
    }

    .bass-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #1e1e2e 0%, #1e1e2e 100%);
      outline: none;
      cursor: pointer;
    }

    .bass-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      cursor: pointer;
      box-shadow: 0 0 12px var(--accent-glow);
      border: 2px solid #fff;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1e1e2e;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
      cursor: pointer;
    }

    .footer {
      text-align: center;
      padding: 16px;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    .supported {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .tag {
      background: rgba(124, 58, 237, 0.15);
      color: var(--accent-glow);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    @media (max-width: 400px) {
      .container {
        border-radius: 16px;
      }
      header {
        padding: 20px 16px 12px;
      }
      .upload-zone, .player {
        margin: 16px;
        padding: 0;
      }
      .upload-zone {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔊 Bass App</h1>
      <p>Boost the low end • Real-time processing</p>
    </header>

    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.aac,.webm" />
      <div class="upload-icon">🎵</div>
      <h3>Drop audio or click to upload</h3>
      <span>MP3, WAV, OGG, FLAC, M4A, AAC supported</span>
    </div>

    <div class="player" id="player">
      <div class="track-info">
        <div class="track-name" id="trackName">No track loaded</div>
        <div class="track-meta" id="trackMeta">—</div>
      </div>

      <div class="visualizer">
        <canvas id="canvas"></canvas>
      </div>

      <div class="progress-container">
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0" step="0.1" />
      </div>

      <div class="controls">
        <button class="btn btn-secondary" id="btnRewind" title="Restart">⏮</button>
        <button class="btn btn-play" id="btnPlay" title="Play / Pause">▶</button>
        <button class="btn btn-secondary" id="btnStop" title="Stop">⏹</button>
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <div class="slider-label">
            <span>🎸</span> Bass Boost
          </div>
          <div class="slider-value" id="bassValue">0</div>
        </div>
        <input type="range" class="bass-slider" id="bassSlider" min="0" max="100" value="0" />
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <div class="slider-label">
            <span>🔊</span> Volume
          </div>
          <div class="slider-value" id="volumeValue">80%</div>
        </div>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" />
      </div>
    </div>

    <div class="footer">
      <div>Bass Max: <strong>100</strong></div>
      <div class="supported">
        <span class="tag">MP3</span>
        <span class="tag">WAV</span>
        <span class="tag">OGG</span>
        <span class="tag">FLAC</span>
        <span class="tag">M4A</span>
        <span class="tag">AAC</span>
      </div>
    </div>
  </div>

  <script>
    // ============ Audio Engine ============
    let audioContext;
    let audioElement;
    let sourceNode;
    let bassFilter;
    let volumeGain;
    let analyser;
    let animationId;
    let isPlaying = false;

    const fileInput = document.getElementById('fileInput');
    const uploadZone = document.getElementById('uploadZone');
    const player = document.getElementById('player');
    const trackName = document.getElementById('trackName');
    const trackMeta = document.getElementById('trackMeta');
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');
    const btnRewind = document.getElementById('btnRewind');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const bassSlider = document.getElementById('bassSlider');
    const bassValue = document.getElementById('bassValue');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Format time
    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // Init Web Audio
    function initAudio() {
      if (audioContext) return;
      audioContext = new (window.AudioContext || window.webkitAudioContext)();

      // Bass filter - lowshelf
      bassFilter = audioContext.createBiquadFilter();
      bassFilter.type = 'lowshelf';
      bassFilter.frequency.value = 150; // Hz - good for bass
      bassFilter.gain.value = 0;

      // Volume
      volumeGain = audioContext.createGain();
      volumeGain.gain.value = volumeSlider.value / 100;

      // Analyser for visualizer
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;

      // Connect chain later when source is ready
    }

    function connectNodes() {
      if (!sourceNode) return;
      sourceNode.connect(bassFilter);
      bassFilter.connect(volumeGain);
      volumeGain.connect(analyser);
      analyser.connect(audioContext.destination);
    }

    // Load file
    function loadFile(file) {
      if (!file || !file.type.startsWith('audio/')) {
        alert('Please select a valid audio file (MP3, WAV, etc.)');
        return;
      }

      initAudio();

      // Clean previous
      if (audioElement) {
        audioElement.pause();
        audioElement.src = '';
        if (sourceNode) {
          try { sourceNode.disconnect(); } catch(e) {}
        }
      }

      audioElement = new Audio();
      audioElement.crossOrigin = 'anonymous';
      audioElement.src = URL.createObjectURL(file);

      audioElement.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audioElement.duration);
        progress.max = audioElement.duration;
        trackName.textContent = file.name;
        trackMeta.textContent = `${(file.size / 1024 / 1024).toFixed(1)} MB • ${file.type.split('/')[1]?.toUpperCase() || 'AUDIO'}`;
        player.classList.add('active');
        uploadZone.style.display = 'none';
      });

      audioElement.addEventListener('timeupdate', () => {
        if (!isNaN(audioElement.currentTime)) {
          progress.value = audioElement.currentTime;
          currentTimeEl.textContent = formatTime(audioElement.currentTime);
        }
      });

      audioElement.addEventListener('ended', () => {
        isPlaying = false;
        btnPlay.textContent = '▶';
        cancelAnimationFrame(animationId);
      });

      // Create source
      sourceNode = audioContext.createMediaElementSource(audioElement);
      connectNodes();

      // Auto play after load (user gesture already happened via file select)
      audioElement.play().then(() => {
        isPlaying = true;
        btnPlay.textContent = '⏸';
        if (audioContext.state === 'suspended') audioContext.resume();
        drawVisualizer();
      }).catch(() => {});
    }

    // Visualizer
    function drawVisualizer() {
      if (!analyser) return;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const width = canvas.width / window.devicePixelRatio;
      const height = canvas.height / window.devicePixelRatio;

      ctx.clearRect(0, 0, width, height);

      const barWidth = (width / bufferLength) * 2.2;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * height * 0.9;
        
        // Gradient from purple to pink based on height
        const gradient = ctx.createLinearGradient(0, height, 0, height - barHeight);
        gradient.addColorStop(0, '#7c3aed');
        gradient.addColorStop(0.6, '#a78bfa');
        gradient.addColorStop(1, '#e879f9');

        ctx.fillStyle = gradient;
        ctx.fillRect(x, height - barHeight, barWidth - 1, barHeight);
        x += barWidth;
      }

      if (isPlaying) {
        animationId = requestAnimationFrame(drawVisualizer);
      }
    }

    // Event listeners
    uploadZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) loadFile(e.target.files[0]);
    });

    // Drag & drop
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    btnPlay.addEventListener('click', async () => {
      if (!audioElement) return;
      if (audioContext.state === 'suspended') await audioContext.resume();

      if (isPlaying) {
        audioElement.pause();
        isPlaying = false;
        btnPlay.textContent = '▶';
        cancelAnimationFrame(animationId);
      } else {
        await audioElement.play();
        isPlaying = true;
        btnPlay.textContent = '⏸';
        drawVisualizer();
      }
    });

    btnStop.addEventListener('click', () => {
      if (!audioElement) return;
      audioElement.pause();
      audioElement.currentTime = 0;
      isPlaying = false;
      btnPlay.textContent = '▶';
      progress.value = 0;
      currentTimeEl.textContent = '0:00';
      cancelAnimationFrame(animationId);
      // Clear canvas
      const width = canvas.width / window.devicePixelRatio;
      const height = canvas.height / window.devicePixelRatio;
      ctx.clearRect(0, 0, width, height);
    });

    btnRewind.addEventListener('click', () => {
      if (audioElement) {
        audioElement.currentTime = 0;
        progress.value = 0;
        currentTimeEl.textContent = '0:00';
      }
    });

    progress.addEventListener('input', () => {
      if (audioElement) {
        audioElement.currentTime = progress.value;
        currentTimeEl.textContent = formatTime(progress.value);
      }
    });

    // Bass slider 0-100 → gain 0 to +24 dB (safe strong boost)
    bassSlider.addEventListener('input', () => {
      const val = parseInt(bassSlider.value);
      bassValue.textContent = val;
      if (bassFilter) {
        // Map 0-100 → 0 to 24 dB
        bassFilter.gain.value = (val / 100) * 24;
      }
      // Update slider visual fill
      const pct = val;
      bassSlider.style.background = `linear-gradient(to right, #7c3aed 0%, #a78bfa ${pct}%, #1e1e2e ${pct}%)`;
    });

    // Volume
    volumeSlider.addEventListener('input', () => {
      const val = parseInt(volumeSlider.value);
      volumeValue.textContent = val + '%';
      if (volumeGain) {
        volumeGain.gain.value = val / 100;
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && audioElement) {
        e.preventDefault();
        btnPlay.click();
      }
    });
  </script>
</body>
</html>
